networks:
  suitesme:

services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
      #- admin
    networks:
      - suitesme

  backend:
    build:
      context: ./backend
    ports:
      - 8080:8080
    volumes:
      - logs_data:/backend/suitesme/cmd/app/logs
    depends_on:
      - postgres
      - minio
    networks:
      - suitesme
    env_file:
      - .env
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=${VITE_API_URL}
    ports:
      - "3000:3000"
    networks:
      - suitesme
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  admin:
    build:
      context: ./admin
    ports:
      - "3001:3000"
    networks:
      - suitesme
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ml-inference:
    build:
      context: ./ml/inference
    ports:
      - "8000:8000"
    networks:
      - suitesme
    environment:
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - ML_ARTIFACTS_BUCKET=ml-artifacts
      - MODEL_CHECK_INTERVAL=300
    depends_on:
      - minio
    volumes:
      - model_cache:/tmp/model_cache
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ml-automl:
    image: prefecthq/prefect:2-python3.9
    depends_on:
      - postgres
      - minio
      - prefect-server
    networks:
      - suitesme
    env_file:
      - .env
    environment:
      - PREFECT_API_URL=http://prefect-server:4200/api
      - MINIO_ENDPOINT=minio:9000
      - PYTHONPATH=/app/automl:/app/ml/inference/src
    volumes:
      - ./ml/automl:/app/automl
      - ./ml/inference:/app/ml/inference
    working_dir: /app/automl
    command: >
      bash -c "
      pip install -q -r requirements.txt &&
      echo '✓ AutoML service ready!' &&
      echo 'Run daily flow: docker compose exec ml-automl python -m flows.dataset_management daily' &&
      echo 'Run monthly flow: docker compose exec ml-automl python -m flows.dataset_management monthly' &&
      tail -f /dev/null
      "
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  prefect-server:
    image: prefecthq/prefect:2-python3.9
    ports:
      - "4200:4200"
    command: prefect server start --host 0.0.0.0
    depends_on:
      prefect-postgres:
        condition: service_started
    networks:
      - suitesme
    environment:
      - PREFECT_API_DATABASE_CONNECTION_URL=postgresql+asyncpg://prefect:prefect@prefect-postgres:5432/prefect
      - PREFECT_SERVER_API_HOST=0.0.0.0
      - PREFECT_API_SERVICES_RUN_IN_APP=false
      - PREFECT_API_SERVICES_SCHEDULER_ENABLED=true
      - PREFECT_API_SERVICES_LATE_RUNS_ENABLED=true
      - PREFECT_API_SERVICES_FLOW_RUN_NOTIFICATIONS_ENABLED=false
      - PREFECT_API_SERVICES_PAUSE_EXPIRATIONS_ENABLED=false
      - PREFECT_API_SERVICES_EVENT_PERSISTER_ENABLED=false
      - PREFECT_SERVER_ANALYTICS_ENABLED=false
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4200/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  prefect-postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=prefect
      - POSTGRES_PASSWORD=prefect
      - POSTGRES_DB=prefect
    volumes:
      - prefect_db_data:/var/lib/postgresql/data
    networks:
      - suitesme
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_HOST=${DB_HOST}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/postgres/init-security.sql:/docker-entrypoint-initdb.d/99-security.sql:ro
    networks:
      - suitesme
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    image: minio/minio
    container_name: minio
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    networks:
      - suitesme
    volumes:
      - minio_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - STYLE_PHOTO_BUCKET=${STYLE_PHOTO_BUCKET}
      - STYLE_PDF_BUCKET=${STYLE_PDF_BUCKET}
      - ML_ARTIFACTS_BUCKET=${ML_ARTIFACTS_BUCKET}
    volumes:
      - ./minio-init.sh:/minio-init.sh
    entrypoint: ["/bin/sh", "/minio-init.sh"]
    networks:
      - suitesme
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  db_data:
  minio_data:
  logs_data:
  prefect_db_data:
  model_cache:
